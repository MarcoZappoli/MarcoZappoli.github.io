# Verification only: builds the site and checks links. Cannot publish.
name: Build check
on:
  push:
    branches: [redesign]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run links
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
          retention-days: 14
